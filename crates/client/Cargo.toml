[package]
name = "runecord"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "runecord_client"
path = "src/lib.rs"

[[bin]]
name = "runecord"
path = "src/main.rs"

[dependencies]
runecord-protocol = { path = "../../../Runecord-backend/crates/protocol" }
rune = { path = "../../../rune/crates/rune" }
rune-kit = { path = "../../../rune/crates/rune-kit", default-features = false, features = ["markdown"] }
rune-motion = { path = "../../../rune/crates/rune-motion" }
rune-notify = { path = "../../../rune/crates/rune-notify" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
image-webp = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-native-roots"] }
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

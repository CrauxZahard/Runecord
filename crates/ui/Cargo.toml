[package]
name = "runecord-ui"
version = "0.1.1"
edition.workspace = true
license.workspace = true

# The view layer, kept apart from the client so it can be edited and rebuilt
# without touching anything that talks to the network. This crate must never
# depend on runecord-client, reqwest, or the session types: a change here is a
# visual change by construction, not by convention.
[dependencies]
rune = { path = "../../../rune/crates/rune" }
runecord-protocol = { path = "../../../Runecord-backend/crates/protocol" }

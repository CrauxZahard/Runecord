[workspace]
resolver = "3"
members = ["crates/client", "tools/cache-bench"]

# Rune is pre-release and built from the local checkout. Its vendored winit/wgpu-hal patches
# must be applied by every workspace that builds it.
[patch.crates-io]
wgpu-hal = { path = "../rune/vendor/wgpu-hal" }
winit = { path = "../rune/vendor/winit" }
# Links libxkbcommon by a relative path for Linux cross-builds; see
# vendor/xkbcommon/build.rs.
xkbcommon = { path = "vendor/xkbcommon" }

[workspace.package]
edition = "2024"
license = "MIT"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
# Keep the incremental cache: with `target/` retained, a rebuild only recompiles
# the crates that changed. `build.bat --clean` drops it when disk matters more.
incremental = true

# Rune's release GPU init takes ~12 s on Windows DX12 without debug assertions
# (a long white window), while the debug-assertion build reaches the first frame
# in about a second. Keep assertions on in release so the packaged app starts
# fast; the code is still optimized.
debug-assertions = true

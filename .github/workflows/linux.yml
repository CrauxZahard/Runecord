name: Linux

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the client
        uses: actions/checkout@v4
        with:
          path: Runecord

      - name: Check out the protocol and server
        uses: actions/checkout@v4
        with:
          repository: CrauxZahard/Runecord-backend
          path: Runecord-backend

      - name: Check out Rune
        uses: actions/checkout@v4
        with:
          repository: anomalyco/rune
          path: rune

      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rustfmt

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake clang libclang-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            libvulkan-dev libasound2-dev libpulse-dev libpipewire-0.3-dev

      - name: Verify the client
        working-directory: Runecord
        run: bash scripts/verify-linux.sh

      - name: Upload the Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: runecord-linux-x86_64
          path: Runecord/target/release/runecord
          if-no-files-found: error
